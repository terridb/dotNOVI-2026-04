name: Deploy to Production

on:
  repository_dispatch:
    types: [deploy-production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Smoke test
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dotnovi-2026-04-ot6d.onrender.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Deploy successful!"
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get previous image tag
        id: previous
        run: |
          # Get the previous deployment's image tag
          # This would normally come from your deployment tracking system
          echo "image_tag=dotnovi:previous" >> $GITHUB_OUTPUT
      - name: Rollback to previous version
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image_tag }}
        run: |
          echo "Rolling back to: $PREVIOUS_IMAGE"
          # kubectl rollout undo deployment/dotnovi